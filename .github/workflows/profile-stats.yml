name: Update GitHub Profile Stats

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  update-profile-stats:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ==================== TROPHY ====================

      - name: Generate GitHub Trophy
        uses: soulteary/github-profile-trophy-action@v1.0.0
        with:
          options: "username=${{ github.repository_owner }}&theme=discord&no-frame=true&no-bg=true&column=7&margin-w=8"
          path: profile/trophy.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      # ==================== GITHUB STATS ====================

      - name: Generate GitHub Stats
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: "username=${{ github.repository_owner }}&show_icons=true&hide_border=true&theme=tokyonight&bg_color=0D1117&title_color=58A6FF&text_color=C9D1D9&icon_color=58A6FF"
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      # ==================== TOP LANGUAGES ====================

      - name: Generate Top Languages
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: "username=${{ github.repository_owner }}&layout=donut&langs_count=5&hide_border=true&theme=tokyonight&bg_color=0D1117&title_color=58A6FF&text_color=C9D1D9"
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      # ==================== COMMIT GENERATED FILES ====================

      - name: Commit generated profile cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add profile/*.svg

          git diff --cached --quiet || git commit -m "chore: update GitHub profile stats"

          git push
